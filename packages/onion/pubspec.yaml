name: onion
description: "Embedded Tor client and loopback SOCKS5 proxy, built on Arti. Not an official Tor Project product."
version: 0.1.0
repository: https://github.com/SatoshiPortal/bull_sdk

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0

  plugin_platform_interface: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ^20.1.1, not the ^21 that `flutter create` picked: flutter_rust_bridge
  # 2.12.0 drives ffigen to emit frb_generated.io.dart, and with ffigen 21 it
  # produced a function body with no signature (an orphaned
  # `) => $allocator<WireSyncRust2DartSse>()`), which does not parse. Same pin
  # as lwk-dart and bull_sdk.
  ffigen: ^20.1.1

  plugin_platform_interface: any
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
