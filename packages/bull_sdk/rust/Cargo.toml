[package]
name = "rust_lib_bull_sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Cross-repository dependencies use immutable revisions so clean builds remain
# reproducible.
bitbox = { git = "https://github.com/SatoshiPortal/bitbox-dart", rev = "b832be8ab497377ac4f9ceb9b0f5f1e830a84e5a", features = ["bull_sdk"] }
bbqr = { git = "https://github.com/SatoshiPortal/bbqr-rust.git", rev = "e4807767d6a61cd7fd9a590f33437553595d0305", default-features = false }
dart_bbqr = { git = "https://github.com/SatoshiPortal/bbqr-dart", rev = "b06901953ab9c0440a9c0373efcc4345f3c35d32", features = ["bull_sdk"] }
boltz = { git = "https://github.com/SatoshiPortal/boltz-dart", rev = "85bcd9fdee8b431c4bf2980fa35c474234e37663", features = ["bull_sdk"] }
# TEMPORARY pin: SatoshiPortal/lwk-dart#94 (transaction projections) is not
# merged/tagged yet — pinned by rev (not branch, per the convention above) to
# the PR head. Re-point to a release ref once #94 lands upstream.
lwk = { git = "https://github.com/SatoshiPortal/lwk-dart", rev = "ed6450a67e6f2646f149025692b2c9dd38f2627b", features = ["bull_sdk"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
