[package]
name = "rust_lib_bull_sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
log = "0.4"
# Transaction signature verification (GHSA-6jp4-8v48-cc5v guard); versions
# already unified in the graph via boltz/lwk.
bitcoin = "0.32"
miniscript = "12"
# Cross-repository dependencies use immutable revisions so clean builds remain
# reproducible.
bitbox = { git = "https://github.com/ethicnology-agent/bitbox-dart", rev = "cefdf32dc873bf7d6a2ee47acb50c7ab42f20097", features = ["bull_sdk"] }
bbqr = { git = "https://github.com/SatoshiPortal/bbqr-rust.git", rev = "e4807767d6a61cd7fd9a590f33437553595d0305", default-features = false }
dart_bbqr = { git = "https://github.com/ethicnology-agent/bbqr-dart", rev = "251ab07f9350e51d02b1d688c3690bbe9cc7c7e5", features = ["bull_sdk"] }
# SatoshiPortal/boltz-dart develop + SwapMasterKey.createFromSeed (feat/swap-master-key-from-seed).
boltz = { git = "https://github.com/ethicnology-agent/boltz-dart", rev = "ae2387f313cf2b4a51d6b92ad2daf4a759fdc757", features = ["bull_sdk"] }
# lwk-dart develop: LWK master, seed-based descriptor and signing, Liquid
# regtest (SatoshiPortal/lwk-dart#99, which includes #88).
lwk = { git = "https://github.com/SatoshiPortal/lwk-dart", rev = "d5f24345e65c6a38fd90d0080ca2a6e553b54d6f", features = ["bull_sdk"] }
dart_bwk = { git = "https://github.com/SatoshiPortal/bwk-dart", rev = "38989212f47f50ccca19fa0d38cb45ef59156f6f", package = "dart_bwk", features = ["bull_sdk"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
